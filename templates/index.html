<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College List Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="wrap">
    <h1>College List Builder</h1>
    <p class="subhead">Describe the student in your own words. GPA, test scores, interests, what they want out of a school, whatever you'd normally tell a colleague.</p>

    <form id="listForm">
      <textarea id="description" name="description" rows="8" placeholder="e.g. Quiet kid, really into marine biology, middling test scores but a great story. Needs financial aid. Somewhere warm would be a plus."></textarea>

      <button type="submit" id="submitBtn">Generate PDF</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('listForm');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const description = document.getElementById('description').value.trim();
      if (!description) {
        status.textContent = 'enter a description first';
        return;
      }

      btn.disabled = true;
      status.textContent = 'building the list... (this calls the model twice, give it a few seconds)';

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          body: new URLSearchParams({ description }),
        });

        if (!res.ok) {
          const err = await res.json();
          status.textContent = 'error: ' + (err.error || 'something went wrong');
          btn.disabled = false;
          return;
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'college_list.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();

        status.textContent = 'done, check your downloads!';
      } catch (err) {
        status.textContent = 'error: ' + err;
      }

      btn.disabled = false;
    });
  </script>

</body>
</html>
